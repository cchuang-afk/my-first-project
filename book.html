<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優雅書籍立體輪播展示系統</title>
    <!-- 引入 Tailwind CSS 進行現代化排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts 繁體中文美化 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }

        /* 3D 書籍透視容器 */
        .book-container {
            perspective: 1200px;
        }

        /* 書本立體主體 */
        .book {
            position: relative;
            width: 240px;
            height: 330px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 5px 5px 20px rgba(0,0,0,0.3);
        }

        /* 側邊書背與厚度效果 */
        .book::before {
            content: "";
            position: absolute;
            width: 30px;
            height: 100%;
            left: 0;
            background: #2d3748;
            transform-origin: left;
            transform: rotateY(-90deg) translateX(-15px);
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.5);
        }

        /* 下方書頁厚度效果 */
        .book::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 30px;
            bottom: 0;
            background: #eae6df;
            transform-origin: bottom;
            transform: rotateX(90deg) translateY(15px);
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }

        /* 書籍懸停 3D 旋轉開書效果 */
        .book-container:hover .book {
            transform: rotateY(-25deg) rotateX(5deg) translateZ(20px);
            box-shadow: 20px 20px 30px rgba(0,0,0,0.4);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between" id="app-body">

    <!-- 背景動態遮罩，提供柔和感 -->
    <div class="fixed inset-0 bg-radial-gradient from-transparent to-slate-950/80 pointer-events-none z-0"></div>

    <!-- 頂部導覽列 -->

        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-book-open text-white text-lg"></i>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-indigo-200 to-white">

                <p class="text-xs text-slate-400">立體互動圖片輪播系統</p>
            </div>
        </div>

        <!-- 模式切換器與狀態提示 -->
        <div class="flex items-center space-x-4 mt-2 sm:mt-0">

            <div class="bg-slate-800/80 p-1 rounded-lg border border-slate-700/50 flex space-x-1 text-xs">

                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Demo 藝術封面
                </button>
                <button id="btn-mode-local" onclick="switchImageMode('local')" class="px-3 py-1.5 rounded-md font-medium transition-all duration-300 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-file-image mr-1"></i> 本機圖片檔
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="relative z-10 flex-grow flex flex-col lg:flex-row items-center justify-center px-4 sm:px-8 py-8 gap-8 lg:gap-12 max-w-7xl mx-auto w-full">
        
        <!-- 左側：3D 書籍輪播展台 -->
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-center">
            
            <!-- 書籍展示主座 -->
            <div class="relative w-full flex items-center justify-center py-10">
                
                <!-- 裝飾底座 -->
                <div class="absolute bottom-6 w-72 h-8 bg-slate-900/80 rounded-full blur-md transform scale-y-50"></div>
                <div class="absolute bottom-8 w-64 h-2 bg-gradient-to-r from-transparent via-white/20 to-transparent rounded-full"></div>

                <!-- 3D 容器 -->
                <div class="book-container relative z-10 cursor-pointer" onclick="openBookDetail()">
                    <div class="book rounded-r-lg overflow-hidden" id="book-element">
                        <!-- 書本封面主體 (透過 JS 動態填入 SVG 或 <img>) -->
                        <div id="book-cover" class="w-full h-full relative"></div>
                    </div>
                </div>

                <!-- 左右操控懸浮按鈕 -->
                <button onclick="prevSlide()" class="absolute left-4 sm:left-10 z-20 w-12 h-12 rounded-full bg-slate-900/60 hover:bg-indigo-600 border border-white/10 hover:border-indigo-500 flex items-center justify-center text-white transition-all duration-300 shadow-lg hover:shadow-indigo-500/20 active:scale-90">
                    <i class="fa-solid fa-chevron-left text-lg"></i>
                </button>
                <button onclick="nextSlide()" class="absolute right-4 sm:right-10 z-20 w-12 h-12 rounded-full bg-slate-900/60 hover:bg-indigo-600 border border-white/10 hover:border-indigo-500 flex items-center justify-center text-white transition-all duration-300 shadow-lg hover:shadow-indigo-500/20 active:scale-90">
                    <i class="fa-solid fa-chevron-right text-lg"></i>
                </button>
            </div>

            <!-- 自動輪播控制 & 指示點 -->
            <div class="flex items-center space-x-6 mt-4">
                <button id="btn-play-pause" onclick="togglePlay()" class="text-slate-400 hover:text-white transition-colors duration-200">
                    <i id="play-icon" class="fa-solid fa-pause text-base"></i>
                </button>
                
                <!-- 點狀進度導航 -->
                <div class="flex space-x-2" id="dots-container">
                    <!-- 由 JS 動態生成 -->
                </div>
            </div>
        </div>

        <!-- 右側：書籍詳情與內容大綱 -->
        <div class="w-full lg:w-1/2 flex flex-col justify-center space-y-6 bg-slate-900/40 p-6 sm:p-8 rounded-2xl border border-white/5 backdrop-blur-lg">
            
            <!-- 書籍分類與編號 -->
            <div class="flex items-center justify-between">
                <span id="book-category" class="px-3 py-1 rounded-full text-xs font-bold tracking-wider uppercase bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    書籍導讀
                </span>
                <span id="book-number" class="text-sm font-mono text-slate-500">
                    01 / 05
                </span>
            </div>

            <!-- 書名與作者 -->
            <div class="space-y-2">
                <h2 id="book-title" class="text-2xl sm:text-4xl font-extrabold tracking-tight leading-tight text-white">
                    加載中...
                </h2>
                <p id="book-author" class="text-indigo-400 text-sm sm:text-base font-medium">
                    作者：--
                </p>
            </div>

            <!-- 分割線 -->
            <div class="h-px bg-gradient-to-r from-slate-700/50 via-slate-700/20 to-transparent"></div>

            <!-- 精選導讀/大綱 -->
            <div class="space-y-4">
                <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400">精選概要</h3>
                <p id="book-description" class="text-slate-300 text-sm sm:text-base leading-relaxed h-28 overflow-y-auto pr-2">
                    正在為您編排內容大綱，請稍候...
                </p>
            </div>

            <!-- 金句推薦 -->
            <div class="bg-white/5 border-l-4 border-indigo-500 p-4 rounded-r-xl italic text-slate-300 text-xs sm:text-sm">
                <i class="fa-solid fa-quote-left mr-2 text-indigo-400"></i>
                <span id="book-quote">閱讀，是探索世界最美的姿態。</span>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex flex-wrap gap-4 pt-2">
                <button onclick="openBookDetail()" class="flex-1 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-500 hover:to-indigo-600 text-white font-medium py-3 px-6 rounded-xl transition-all duration-300 shadow-lg shadow-indigo-600/20 hover:shadow-indigo-500/30 active:scale-[0.98] flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>查看完整書評與大綱</span>
                </button>
            </div>
        </div>
    </main>

    <!-- 下方快速切換縮圖列 -->
    <footer class="relative z-10 w-full py-4 px-6 border-t border-white/5 bg-slate-950/60 backdrop-blur-md">
        <div class="max-w-4xl mx-auto flex flex-col items-center space-y-3">

            <div class="flex items-center justify-center gap-3 sm:gap-4 overflow-x-auto w-full py-1" id="thumbnails-container">
                <!-- 由 JS 動態生成 -->
            </div>
        </div>
    </footer>

    <!-- 自訂訊息與詳情 Modal 彈出視窗 -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-slate-900 border border-white/10 rounded-2xl max-w-lg w-full p-6 sm:p-8 space-y-6 shadow-2xl transform scale-95 transition-transform duration-300" id="modal-box">

                    <i class="fa-solid fa-feather-pointed text-xl"></i>

                </div>
                <button onclick="closeBookDetail()" class="text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <h3 id="modal-book-title" class="text-2xl font-black text-white">書名</h3>
                <div class="h-px bg-slate-800"></div>

        // 狀態管理
        let currentIndex = 0;
        let isPlaying = true;
        let carouselTimer = null;
        let imageMode = 'demo'; // 'demo' 或 'local'
        let touchStartX = 0;
        let touchEndX = 0;

        // 初始化網頁
        window.onload = function() {
            renderDots();
            renderThumbnails();
            updateDisplay();
            startAutoplay();
            
            // 監聽鍵盤箭頭
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    prevSlide();
                    resetAutoplay();
                } else if (e.key === 'ArrowRight') {
                    nextSlide();
                    resetAutoplay();
                }
            });

            // 監聽手機滑動手勢
            const bookShowcase = document.getElementById('book-element');
            bookShowcase.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, {passive: true});

            bookShowcase.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, {passive: true});
        }

        // 處理手勢滑動
        function handleSwipe() {
            if (touchStartX - touchEndX > 50) {
                // 向左滑，下一張
                nextSlide();
                resetAutoplay();
            }
            if (touchEndX - touchStartX > 50) {
                // 向右滑，上一張
                prevSlide();
                resetAutoplay();
            }
        }

        // 動態生成指示點 (Dots)
        function renderDots() {
            const container = document.getElementById('dots-container');
            container.innerHTML = '';
            booksData.forEach((book, index) => {
                const dot = document.createElement('button');
                dot.className = `w-3 h-3 rounded-full transition-all duration-300 ${index === currentIndex ? 'bg-indigo-500 scale-125' : 'bg-slate-600 hover:bg-slate-400'}`;
                dot.setAttribute('aria-label', `跳至第 ${index + 1} 本書`);
                dot.onclick = () => {
                    jumpToSlide(index);
                    resetAutoplay();
                };
                container.appendChild(dot);
            });
        }

        // 動態生成下方快速縮圖列
        function renderThumbnails() {
            const container = document.getElementById('thumbnails-container');
            container.innerHTML = '';
            booksData.forEach((book, index) => {
                const thumb = document.createElement('button');
                thumb.id = `thumb-${index}`;
                // 設定縮圖樣式與特效
                thumb.className = `flex-shrink-0 w-12 h-16 sm:w-16 sm:h-22 rounded-md overflow-hidden border-2 transition-all duration-300 shadow transform hover:-translate-y-1 ${index === currentIndex ? 'border-indigo-500 scale-110 ring-2 ring-indigo-500/30' : 'border-transparent opacity-60 hover:opacity-100'}`;
                
                // 縮圖內容
                if (imageMode === 'demo') {
                    // 使用縮小的 SVG
                    thumb.innerHTML = `<div class="w-full h-full pointer-events-none transform scale-100 origin-top-left">${book.demoSvg}</div>`;
                } else {
                    // 使用真實本機圖片
                    thumb.innerHTML = `<img src="${book.localImage}" alt="${book.title}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=100&q=80';">`;
                }
                
                thumb.onclick = () => {
                    jumpToSlide(index);
                    resetAutoplay();
                };
                container.appendChild(thumb);
            });
        }

        // 更新核心介面展示
        function updateDisplay() {
            const book = booksData[currentIndex];
            
            // 1. 動態調色盤：過渡背景與光暈
            document.getElementById('app-body').style.background = book.bgColor;

            // 2. 更新封面主體
            const coverContainer = document.getElementById('book-cover');
            if (imageMode === 'demo') {
                coverContainer.innerHTML = book.demoSvg;
            } else {
                coverContainer.innerHTML = `
                    <img src="${book.localImage}" alt="${book.title}" class="w-full h-full object-cover" onerror="handleImageError(this, ${book.id})">
                `;
            }

            // 3. 更新文字資訊
            document.getElementById('book-title').innerText = book.title;
            document.getElementById('book-author').innerText = `作者：${book.author}`;
            document.getElementById('book-category').innerText = book.category;
            document.getElementById('book-description').innerText = book.description;
            document.getElementById('book-quote').innerText = book.quote;
            document.getElementById('book-number').innerText = `0${currentIndex + 1} / 05`;

            // 4. 更新指示點 Active 狀態
            const dots = document.getElementById('dots-container').children;
            for (let i = 0; i < dots.length; i++) {
                if (i === currentIndex) {
                    dots[i].className = "w-8 h-3 rounded-full bg-indigo-500 transition-all duration-300";
                } else {
                    dots[i].className = "w-3 h-3 rounded-full bg-slate-600 hover:bg-slate-400 transition-all duration-300";
                }
            }

            // 5. 更新縮圖 Active 狀態
            booksData.forEach((_, index) => {
                const thumb = document.getElementById(`thumb-${index}`);
                if (thumb) {
                    if (index === currentIndex) {
                        thumb.className = "flex-shrink-0 w-12 h-16 sm:w-16 sm:h-22 rounded-md overflow-hidden border-2 transition-all duration-300 shadow transform hover:-translate-y-1 border-indigo-500 scale-110 ring-2 ring-indigo-500/30 opacity-100";
                    } else {
                        thumb.className = "flex-shrink-0 w-12 h-16 sm:w-16 sm:h-22 rounded-md overflow-hidden border-2 transition-all duration-300 shadow transform hover:-translate-y-1 border-transparent opacity-60 hover:opacity-100";
                    }
                }
            });
        }

        // 圖片載入失敗退路處理
        function handleImageError(imgElement, id) {
            const book = booksData.find(b => b.id === id);
            // 本機讀取失敗時，自動使用 Demo 藝術封面填充，保證使用者介面永遠完美
            imgElement.parentElement.innerHTML = book.demoSvg;
            showToast(`找不到本機圖片 ${book.localImage}，已自動切換成藝術 Demo 封面！`);
        }

        // 切換顯示模式 (Demo SVG / Local WebP)
        function switchImageMode(mode) {
            if (imageMode === mode) return;
            imageMode = mode;
            
            const btnDemo = document.getElementById('btn-mode-demo');
            const btnLocal = document.getElementById('btn-mode-local');
            
            if (mode === 'demo') {
                btnDemo.className = "px-3 py-1.5 rounded-md font-medium transition-all duration-300 bg-indigo-600 text-white shadow";
                btnLocal.className = "px-3 py-1.5 rounded-md font-medium transition-all duration-300 text-slate-400 hover:text-white";
                showToast("已切換為：內建優雅 Demo 藝術封面！");
            } else {
                btnLocal.className = "px-3 py-1.5 rounded-md font-medium transition-all duration-300 bg-indigo-600 text-white shadow";
                btnDemo.className = "px-3 py-1.5 rounded-md font-medium transition-all duration-300 text-slate-400 hover:text-white";
                showToast("已切換為：讀取本機圖片。請確保圖片檔案與網頁在同個目錄下！");
            }
            
            renderThumbnails();
            updateDisplay();
        }

        // 顯示提示彈出框 (Toast)
        function showToast(text) {
            const toast = document.getElementById('toast-message');
            const toastText = document.getElementById('toast-text');
            toastText.innerText = text;
            
            toast.className = "fixed bottom-24 right-6 z-50 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 border border-indigo-400/20 translate-y-0 opacity-100 transition-all duration-300 pointer-events-auto";
            
            setTimeout(() => {
                toast.className = "fixed bottom-24 right-6 z-50 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center space-x-3 border border-indigo-400/20 translate-y-20 opacity-0 transition-all duration-300 pointer-events-none";
            }, 3500);
        }

        // 下一張
        function nextSlide() {
            currentIndex = (currentIndex + 1) % booksData.length;
            updateDisplay();
        }

        // 上一張
        function prevSlide() {
            currentIndex = (currentIndex - 1 + booksData.length) % booksData.length;
            updateDisplay();
        }

        // 直接跳至指定幻燈片
        function jumpToSlide(index) {
            currentIndex = index;
            updateDisplay();
        }

        // 自動輪播核心
        function startAutoplay() {
            carouselTimer = setInterval(nextSlide, 5000); // 5秒自動切換下一張
            isPlaying = true;
            document.getElementById('play-icon').className = "fa-solid fa-pause text-base";
        }

        function stopAutoplay() {
            clearInterval(carouselTimer);
            isPlaying = false;
            document.getElementById('play-icon').className = "fa-solid fa-play text-base";
        }

        function togglePlay() {
            if (isPlaying) {
                stopAutoplay();
                showToast("自動播放已暫停");
            } else {
                startAutoplay();
                showToast("自動播放已重新啟動");
            }
        }

        function resetAutoplay() {
            if (isPlaying) {
                clearInterval(carouselTimer);
                startAutoplay();
            }
        }

        // 開啟詳情 Modal
        function openBookDetail() {
            stopAutoplay(); // 查看詳情時暫停播放
            const book = booksData[currentIndex];
            document.getElementById('modal-book-title').innerText = book.title;
            document.getElementById('modal-book-intro').innerText = book.detailedIntro;
            
            const modal = document.getElementById('detail-modal');
            const box = document.getElementById('modal-box');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        // 關閉詳情 Modal
        function closeBookDetail() {
            const modal = document.getElementById('detail-modal');
            const box = document.getElementById('modal-box');
            
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            
            startAutoplay(); // 關閉後重新恢復自動播放
        }
    </script>
</body>
