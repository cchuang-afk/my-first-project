<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116年度學校護理人員寒假繼續教育研習課程報名系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 text-slate-800 antialiased">

    <!-- 主卡片容器 -->
    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200/80 my-auto">
        
        <!-- 橫幅宣傳區 -->
        <div class="relative bg-gradient-to-r from-teal-600 via-teal-500 to-cyan-600 p-6 sm:p-10 text-white text-center overflow-hidden">
            <!-- 背景裝飾圓圈 -->
            <div class="absolute -right-10 -bottom-10 w-40 h-40 rounded-full bg-white/10 blur-xl pointer-events-none"></div>
            <div class="absolute -left-10 -top-10 w-40 h-40 rounded-full bg-cyan-400/20 blur-xl pointer-events-none"></div>

            <div class="relative z-10">
                <div class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-white/20 text-white backdrop-blur-md mb-3 shadow-sm border border-white/20">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 mr-1.5"></i>
                    116年度寒假研習課程
                </div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight mb-2 drop-shadow-sm">
                    學校護理人員寒假繼續教育研習課程
                </h1>
                <p class="text-teal-50 text-xs sm:text-sm font-medium tracking-wide opacity-95 mb-4">
                    專業成長 · 衛教精進 · 校園健康守護 · 護理積分認證
                </p>
                
                <!-- 貼心提醒標籤 -->
                <div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-amber-400/20 text-amber-100 text-xs sm:text-sm border border-amber-300/40 backdrop-blur-xs font-medium">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-amber-300 shrink-0"></i>
                    <span><strong>貼心提醒：</strong>以「<strong>116年有效會員資格</strong>」優先報名錄取。</span>
                </div>
            </div>
        </div>

        <!-- 核心狀態與報名時間資訊區 -->
        <div class="p-6 sm:p-8 bg-amber-50/70 border-b border-amber-100">
            <div class="flex flex-col items-center text-center">
                
                <!-- 狀態標籤 -->
                <div class="flex flex-wrap justify-center gap-2 mb-5">
                    <span class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-amber-100 text-amber-800 border border-amber-200/80 shadow-xs">
                        <span class="w-2 h-2 rounded-full bg-amber-500 mr-2 animate-ping"></span>
                        尚未開放報名
                    </span>
                    <span class="inline-flex items-center px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-rose-100 text-rose-800 border border-rose-200/80 shadow-xs">
                        <i data-lucide="users" class="w-4 h-4 mr-1.5"></i>
                        限額 300 人 (滿額關閉系統)
                    </span>
                </div>

                <!-- 報名時間與研習資訊說明 -->
                <h2 class="text-lg sm:text-xl font-black text-slate-800 mb-4 tracking-wide flex items-center">
                    <i data-lucide="clock" class="w-5 h-5 text-teal-600 mr-2"></i> 研習與報名時間資訊
                </h2>
                <div class="text-slate-700 space-y-2.5 max-w-lg w-full bg-white/80 p-4 rounded-xl border border-amber-200/60 shadow-xs text-left">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1 text-sm sm:text-base border-b border-slate-100 pb-2">
                        <span class="text-slate-500 font-medium flex items-center"><i data-lucide="calendar-check" class="w-4 h-4 mr-1.5 text-teal-600"></i> 📅 研習時間：</span>
                        <span class="font-bold text-slate-800 bg-amber-100/80 px-2.5 py-1 rounded-lg border border-amber-200">
                            116年 1 月 22 日 (週五)
                        </span>
                    </div>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1 text-sm sm:text-base border-b border-slate-100 pb-2">
                        <span class="text-slate-500 font-medium flex items-center"><i data-lucide="map-pin" class="w-4 h-4 mr-1.5 text-teal-600"></i> 📍 研習地點：</span>
                        <span class="font-bold text-slate-800 text-xs sm:text-sm">
                            國光高級中學 八德館 6 樓演講廳
                        </span>
                    </div>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1 text-sm sm:text-base border-b border-slate-100 pb-2">
                        <span class="text-slate-500 font-medium flex items-center"><i data-lucide="play-circle" class="w-4 h-4 mr-1.5 text-teal-600"></i> 開放報名：</span>
                        <span class="font-bold text-teal-700 bg-teal-50 px-2.5 py-1 rounded-lg border border-teal-100">
                            12 月 28 日 上午 08:00
                        </span>
                    </div>
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-1 text-sm sm:text-base">
                        <span class="text-slate-500 font-medium flex items-center"><i data-lucide="stop-circle" class="w-4 h-4 mr-1.5 text-rose-500"></i> 截止報名：</span>
                        <span class="font-bold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-100">
                            12 月 31 日 下午 16:00 前
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 倒數計時器區塊 -->
        <div class="p-6 sm:p-10 text-center bg-white">
            <p class="text-slate-500 text-xs sm:text-sm font-bold uppercase tracking-wider mb-5 flex items-center justify-center">
                <i data-lucide="timer" class="w-4 h-4 mr-1.5 text-teal-600"></i> 距離開放報名還有
            </p>
            <div class="grid grid-cols-4 gap-2.5 sm:gap-6 max-w-md mx-auto">
                <!-- 天 -->
                <div class="bg-gradient-to-b from-slate-50 to-slate-100 rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs">
                    <span id="days" class="block text-2xl sm:text-4xl font-black text-teal-600 font-mono">00</span>
                    <span class="text-xs text-slate-500 mt-1 block font-medium">天</span>
                </div>
                <!-- 時 -->
                <div class="bg-gradient-to-b from-slate-50 to-slate-100 rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs">
                    <span id="hours" class="block text-2xl sm:text-4xl font-black text-teal-600 font-mono">00</span>
                    <span class="text-xs text-slate-500 mt-1 block font-medium">時</span>
                </div>
                <!-- 分 -->
                <div class="bg-gradient-to-b from-slate-50 to-slate-100 rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs">
                    <span id="minutes" class="block text-2xl sm:text-4xl font-black text-teal-600 font-mono">00</span>
                    <span class="text-xs text-slate-500 mt-1 block font-medium">分</span>
                </div>
                <!-- 秒 -->
                <div class="bg-gradient-to-b from-slate-50 to-slate-100 rounded-2xl p-3 sm:p-4 border border-slate-200/80 shadow-xs">
                    <span id="seconds" class="block text-2xl sm:text-4xl font-black text-rose-500 font-mono animate-pulse">00</span>
                    <span class="text-xs text-slate-500 mt-1 block font-medium">秒</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 初始化 Lucide 圖標
        lucide.createIcons();

        // 開放報名目標時間（12月28日上午08:00:00）
        const TARGET_DATE = new Date("2026-12-28T08:00:00").getTime();

        // 倒數計時器邏輯
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = TARGET_DATE - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
